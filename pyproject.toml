[project]
name = "assistant"
version = "0.1.0"
description = "Asistente personal con interfaz Telegram para asignar y procesar tareas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pymongo>=4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
assistant = "assistant.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]
